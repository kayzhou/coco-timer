name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMG & Publish Release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # Package.swift needs Swift 6; runner default Xcode is still 5.10
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Swift version
        run: swift --version

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Release tag must be v followed by a numeric version, e.g. v1.2 or v1.2.3" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/HanzhangKezhen-${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DMG: ${{ steps.meta.outputs.dmg }}
        run: |
          make dmg VERSION="$VERSION"
          cp "dist/含章可贞-${VERSION}.dmg" "$DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 含章可贞 ${{ steps.meta.outputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            macOS 菜单栏休息提醒。默认每工作 25 分钟，全屏停下 1 分钟。

            ## 安装

            下载下方 `HanzhangKezhen-*.dmg`（即「含章可贞」），打开后把应用拖到 Applications。

            若系统提示无法验证开发者，到「隐私与安全性」里选择仍要打开。

            > 本构建为 ad-hoc 签名（非 Developer ID / 未公证）。
            > GitHub Release 资源名不支持中文，故使用拼音文件名。
          files: ${{ steps.meta.outputs.dmg }}
